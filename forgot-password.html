<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | BIZNEXT DIGITAL COMPANY</title>
<meta name="description" content="Forgot Password - BIZNEXT DIGITAL COMPANY">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="forgot">
<header id="site-header"></header>
<div class="container"><div class="form-card">
<h1>Reset password</h1><p class="sub">Enter your email to receive a reset code</p>
<form id="form"><div id="mainFields"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
<div id="otpBox" class="hidden"><label for="otp">Reset code</label><input id="otp" name="otp" inputmode="numeric" maxlength="6">
<label for="password">New password (min 8 characters)</label><input id="password" name="password" type="password" minlength="8"><p style="margin-top:6px"><a href="#" id="resend" style="font-size:13px">Resend code</a></p></div>
<div id="msg" class="msg"></div><button type="submit" class="btn btn-primary btn-block" style="margin-top:12px">Continue</button></form>
<p style="text-align:center;margin-top:16px;font-size:14px"><a href="/login.html">Back to login</a></p></div></div>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
