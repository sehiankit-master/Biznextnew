<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | BIZNEXT DIGITAL COMPANY</title>
<meta name="description" content="Register - BIZNEXT DIGITAL COMPANY">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="register">
<header id="site-header"></header>
<div class="container"><div class="form-card">
<h1>Create your account</h1><p class="sub">Register to buy plans and products</p>
<form id="form"><div id="mainFields">
<label for="name">Full name</label><input id="name" name="name" required minlength="2" maxlength="80" autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="phone">Mobile / WhatsApp number</label><input id="phone" name="phone" type="tel" autocomplete="tel">
<label for="password">Password (min 8 characters)</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
<label for="password2">Confirm password</label><input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password">
<label class="check"><input type="checkbox" name="agree"> <span>I accept the <a href="/terms.html" target="_blank">Terms</a> and <a href="/privacy-policy.html" target="_blank">Privacy Policy</a></span></label></div>
<div id="otpBox" class="hidden"><label for="otp">6-digit verification code (sent to your email)</label><input id="otp" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><p style="margin-top:6px"><a href="#" id="resend" style="font-size:13px">Resend code</a></p></div>
<div id="msg" class="msg"></div><button type="submit" class="btn btn-primary btn-block" style="margin-top:12px">Register</button></form>
<p style="text-align:center;margin-top:16px;font-size:14px">Already registered? <a href="/login.html">Login</a></p></div></div>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
