<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | BIZNEXT DIGITAL COMPANY</title>
<meta name="description" content="Login - BIZNEXT DIGITAL COMPANY">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="login">
<header id="site-header"></header>
<div class="container"><div class="form-card">
<h1>Welcome back</h1><p class="sub">Login to your BIZNEXT account</p>
<form id="form"><div id="mainFields">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
<p style="text-align:right;margin-top:6px"><a href="/forgot-password.html" style="font-size:13px">Forgot password?</a></p></div>
<div id="otpBox" class="hidden"><label for="otp">6-digit verification code</label><input id="otp" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><p style="margin-top:6px"><a href="#" id="resend" style="font-size:13px">Resend code</a></p></div>
<div id="msg" class="msg"></div><button type="submit" class="btn btn-primary btn-block" style="margin-top:12px">Login</button></form>
<p style="text-align:center;margin-top:16px;font-size:14px">New here? <a href="/register.html">Create an account</a></p></div></div>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
